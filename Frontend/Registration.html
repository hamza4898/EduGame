<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Регистрация</title>
    <link rel = "stylesheet" href = "Registration.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <script src = "Registration.js"></script>
</head>
<body style = "background-color: black;">
    <section id="cooperation">
        <div class="container">
            <h2 class = "register-title animate__animated animate__fadeIn" style = "color: aliceblue;">Готовы поработать с нами?</h2>
            <div class="cta-grid animate__animated animate__fadeIn">
                <div class="cta-card" style = "color: white;">
                    <h3>👨‍🎓 Ученик</h3>
                    <p>Пройдите курсы, получите сертификаты</p>
                    <button class="role-btn student-btn" onclick="showForm('student')">Начать обучение</button>
                </div>
                
                <div class="cta-card" style = "color: white;">
                    <h3>👨‍🏫 Преподаватель</h3>
                    <p>Создавайте курсы, обучайте студентов</p>
                    <button class="role-btn teacher-btn" onclick="showForm('teacher')">Стать автором</button>
                </div>
                
                <div class="cta-card" style = "color: white;">
                    <h3>🤝 Партнерство</h3>
                    <p>Школы, вузы, компании, франшизы и другие организации</p>
                    <button class="role-btn partner-btn" onclick="showForm('partner')">Предложить партнерство</button>
                </div>
            </div>
            
            <div id="studentForm" class="role-form">
                <button class="back-btn" type="button" onclick="hideAllForms()">← Назад к выбору</button>
                <h3>👨‍🎓 Регистрация ученика</h3>
                <form method="post" action="/api/Student/RegisterStudent">
                    <input name = "FirstName" type="text" placeholder="Фамилия" required>
                    <input name = "LastName" type="text" placeholder="Имя" required>
                    <select name = "Gender" required aria-placeholder="Пол">
                        <option value="" selected disabled>Пол</option>
                        <option value="Male">Мужской</option>
                        <option value="Female">Женский</option>
                    </select>
                    <input name = "PhoneNumber" type="tel" placeholder="Телефон" required>
                    <input name="DateOfBirth" type="text" placeholder="Дата рождения" onfocus="(this.type='date')" onblur="if(!this.value) this.type='text'" required>
                    <select name = "Education" required aria-placeholder = "Образование">
                        <option value="" selected disabled>Образование</option>
                        <option value="Pupil">Ученик начальной школы</option>
                        <option value="Middle School">Ученик средней школы</option>
                        <option value="High School">Ученик старшей школы</option>
                        <option value="Student">Студент</option>
                        <option value="Other">Другое</option>
                    </select>
                    <input name = "Email" type="email" placeholder="Email" required>
                    <input name = "Password" type="password" placeholder="Пароль" required>
                    <textarea name="Motivation" placeholder="В чем ваша мотивация?" rows="4" required></textarea>
                    <button id="reg-btn" type="submit" class="submit-btn">Начать обучение</button>
                </form>
            </div>

            <div id="teacherForm" class="role-form">
                <button class="back-btn" onclick="hideAllForms()">← Назад к выбору</button>
                <h3>👨‍🏫 Заявка преподавателя</h3>
                <form method="post" action="/api/Teacher/RegisterTeacher">
                    <input name = "FirstName" type="text" placeholder="Фамилия" required>
                    <input name = "LastName" type="text" placeholder="Имя" required>
                    <select name = "Gender" required aria-placeholder="Пол">
                        <option value="" selected disabled>Пол</option>
                        <option value="Male">Мужской</option>
                        <option value="Female">Женский</option>
                    </select>
                    <input name = "PhoneNumber" type="tel" placeholder="Телефон" required>
                    <input name="DateOfBirth" type="text" placeholder="Дата рождения" onfocus="(this.type='date')" onblur="if(!this.value) this.type='text'" required>
                    <input name = "Subject" type="text" placeholder="Предмет" required>
                    <input name = "Email" type="email" placeholder="Email" required>
                    <input name = "Password" type="password" placeholder="Пароль" required>
                    <textarea name="Motivation" placeholder="Опыт преподавания, примеры работ" rows="4" required></textarea>
                    <button id="reg-btn" type="submit" class="submit-btn">Начать обучение</button>
                </form>
            </div>

            <div id="partnerForm" class="role-form">
                <button class="back-btn" onclick="hideAllForms()">← Назад к выбору</button>
                <h3>🤝 Заявка на партнерство</h3>
                <form method="post" action="/api/Partner/RegisterPartner">
                    <input name="Company" type="text" placeholder="Название компании/организации" required>
                    <input name = "FirstName" type="text" placeholder="Фамилия контактного лица" required>
                    <input name = "LastName" type="text" placeholder="Имя контактного лица" required>
                    <input name = "PhoneNumber" type="tel" placeholder="Телефон" required>
                    <input name="DateOfBirth" type="text" placeholder="Дата рождения" onfocus="(this.type='date')" onblur="if(!this.value) this.type='text'" required>
                    <select name="TypeOfCooperation" required aria-placeholder="Сотрудничество">
                        <option value="" selected disabled>Тип сотрудничества</option>
                        <option value="School">Школа</option>
                        <option value="University">Вуз</option>
                        <option value="Company">Компания</option>
                        <option value="Franchise">Франшиза</option>
                        <option value="Other">Другое</option>
                    </select>
                    <input name="Email"type="email" placeholder="Email" required>
                    <input name = "Password" type="password" placeholder="Пароль" required>
                    <textarea name="Motivation" placeholder="Предложение по сотрудничеству" rows="4" required></textarea>
                    <button id="reg-btn" type="submit" class="submit-btn">Отправить заявку</button>
                </form>
            </div>
        </div>
    </section> 
</body>
</html>
