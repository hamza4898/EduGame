<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Профиль</title>
    <link rel = "stylesheet" href = "Profile.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
</head>
<body>
    <section id="cooperation" class="hero">
        <div class="container">         
            <div id="profileView" class="role-form glass-morphism animate__animated animate__zoomIn">
                <div class="profile-avatar-container">
                    <div class="avatar-circle">
                        <img id="u-avatar" src="images/бибизяка.jpeg" alt="Avatar">
                    </div>
                </div>

                <h3 class="profile-title">Ваш профиль</h3>
            
                <div class="profile-grid">
                    <div class="info-card">
                        <label>Фамилия</label>
                        <div id="u-lastname" class="info-text">Загрузка...</div>
                    </div>

                    <div class="info-card">
                        <label>Имя</label>
                        <div id="u-firstname" class="info-text">Загрузка...</div>
                    </div>
                
                    <div class="info-card">
                        <label>Пол</label>
                        <div id="u-gender" class="info-text">Загрузка...</div>
                    </div>

                    <div class="info-card">
                        <label>Образование</label>
                        <div id="u-edu" class="info-text">Загрузка...</div>
                    </div>
                </div>
                <br>

                <div class="info-card full-width">
                    <label>Моя мотивация</label>
                    <div id="u-motivation" class="info-text">Загрузка данных из базы данных...</div>
                </div>

                <div class="profile-actions">
                    <button class="action-btn exit-btn" onclick="location.href = 'Main.html'">
                        На главную
                    </button>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
