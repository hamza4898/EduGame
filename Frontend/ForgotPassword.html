<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Восстановление пароля EduGame</title>
    <link rel="stylesheet" href="ForgotPassword.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
</head>
<body class="animate__animated animate__zoomIn">
    <div class="recovery-card animate__animated animate__fadeIn">

        <button class="back-circle" onclick="goBackStep()">
            <img src="images/стрелка.jpg" alt="Назад" class="back-icon">
        </button>

        <div class="steps-wrapper">
            <section id="step-email" class="step active animate__animated">
            <img src="images/замок.png" alt="Lock" class="lock-img">
            <h1 class="main-title">Забыли свой пароль от EduGame?</h1>
            <label class="step-label">Введите вашу почту для восстановления</label>
            <form onsubmit="handleEmail()" style="display: contents">
                <input type="email" id="email-field" class="big-input" placeholder="Ваш Email" required>
                <button type="submit" class="blue-btn">Отправить код</button>
            </form>
        </section>

        <section id="step-code" class="step animate__animated">
            <img src="images/замокДляКлюча.png" alt="Lock" class="code-img" onclick="exitToLogin()">
            <h1 class="code-title">Введите 6-значный код</h1>
            <label class="code-label">Если введенная почта зарегистрирована в EduGame, на него будет отправлен код</label>
            <form onsubmit="handleCode()" style="display: contents">
                <div class="code-container">
                    <input type="text" class="code-input" maxlength="1" placeholder=" " pattern="\d{1}" inputmode="numeric" required/>
                    <input type="text" class="code-input" maxlength="1" placeholder=" " pattern="\d{1}" inputmode="numeric" required/>
                    <input type="text" class="code-input" maxlength="1" placeholder=" " pattern="\d{1}" inputmode="numeric" required/>
                    <input type="text" class="code-input" maxlength="1" placeholder=" " pattern="\d{1}" inputmode="numeric" required/>
                    <input type="text" class="code-input" maxlength="1" placeholder=" " pattern="\d{1}" inputmode="numeric" required/>
                    <input type="text" class="code-input" maxlength="1" placeholder=" " pattern="\d{1}" inputmode="numeric" required/>
                </div>
                
                <button type="submit" class="blue-btn">Подтвердить</button>
            </form>
        </section>
        </div>
    </div>

    <script src="ForgotPassword.js"></script>
</body>
</html>
