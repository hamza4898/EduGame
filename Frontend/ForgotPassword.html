<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Восстановление пароля EduGame</title>
    <link rel="stylesheet" href="ForgotPassword.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link rel="icon" type="image/png" href="images/hamzaBro3.png">
</head>
<body class="animate__animated animate__zoomIn">
    <div class="recovery-card animate__animated animate__fadeIn">

        <button class="back-circle" id="backBtn" onclick="goBackStep()">
            <img src="images/стрелка.jpg" alt="Назад" class="back-icon">
        </button>

        <div class="steps-wrapper">
            <section id="step-email" class="step active animate__animated">
            <img src="images/замок.png" alt="Lock" class="lock-img">
            <h1 class="main-title">Забыли свой пароль от EduGame?</h1>
            <label class="step-label">Введите вашу почту для восстановления</label>
            <form onsubmit="handleEmail()" style="display: contents">
                <input type="email" id="email-field" class="big-input" placeholder="Ваш Email" required>
                <button type="submit" class="blue-btn">Отправить код</button>
            </form>
        </section>

        <section id="step-code" class="step animate__animated">
            <img src="images/замокДляКлюча.png" alt="Lock" class="code-img" onclick="exitToLogin()">
            <h1 class="code-title">Введите 6-значный код</h1>
            <label class="code-label">Если введенная почта зарегистрирована в EduGame, на него будет отправлен код</label>
            <form onsubmit="handleCode()" style="display: contents">
                <div class="code-container">
                    <input type="text" class="code-input" maxlength="1" placeholder=" " inputmode="text" required/>
                    <input type="text" class="code-input" maxlength="1" placeholder=" " inputmode="text" required/>
                    <input type="text" class="code-input" maxlength="1" placeholder=" " inputmode="text" required/>
                    <input type="text" class="code-input" maxlength="1" placeholder=" " inputmode="text" required/>
                    <input type="text" class="code-input" maxlength="1" placeholder=" " inputmode="text" required/>
                    <input type="text" class="code-input" maxlength="1" placeholder=" " inputmode="text" required/>
                </div>
                
                <button type="submit" class="blue-btn">Подтвердить</button>
            </form>
        </section>

        <section id="step-password" class="step animate__animated" style="display: none;">
            <img src="images/замок.png" alt="Lock" class="lock-img">
    
            <h1 class="main-title">Придумайте новый пароль</h1>
            <label class="step-label">Пароль должен быть надежным и содержать не менее 6 символов</label>
    
            <form onsubmit="handleResetPassword()" style="display: contents">
        
                <div class="password-container" style="width: 100%; display: flex; flex-direction: column; gap: 15px; margin-bottom: 20px;">
            
                    <div class="password-field-wrapper">
                        <input type="password" id="new-password" class="big-input" placeholder="Новый пароль" minlength="6" required>
                        <button type="button" class="password-toggle-btn" onclick="togglePass(this)">👁️</button>
                    </div>

                    <div class="password-field-wrapper">
                        <input type="password" id="confirm-password" class="big-input" placeholder="Повторите новый пароль" minlength="6" required>
                        <button type="button" class="password-toggle-btn" onclick="togglePass(this)">👁️</button>
                    </div>
                </div>
        
                <button type="submit" class="blue-btn">Сохранить пароль</button>
            </form>
        </section>
    <script src="Api-client.js"></script>
    <script src="ForgotPassword.js"></script>
</body>
</html>
