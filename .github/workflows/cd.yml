name: EduGame CD (Push Docker Image)

on:
  push:
    branches: [ "main", "master" ]

jobs:
  validate-before-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4
    - name: Setup .NET 9 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'
    - name: Restore packages
      run: dotnet restore EduGame.sln
    - name: Build and Test
      run: dotnet test EduGame.sln --configuration Release --verbosity normal

  build-and-push-docker:
    runs-on: ubuntu-latest
    needs: validate-before-deploy
    
    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and Push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ghcr.io/${{ github.repository }}/edu-fullstack:latest
